<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-50 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 w-full max-w-md shadow-xl">

        <h2 class="text-2xl font-bold mb-6 text-center text-sky-400">
            Password Strength Checker
        </h2>

        <form id="passwordForm">
            <div>
                <label class="block text-sm mb-2 text-slate-300 font-medium">
                    Password
                </label>

                <!-- Container for Input and Eye Icon -->
                <div class="relative">
                    <input type="password" id="password" placeholder="Enter your password"
                        class="w-full p-3 pr-12 bg-slate-900 border border-slate-700 rounded-xl text-slate-50 outline-none focus:border-sky-500 transition-colors box-border">

                    <!-- Show/Hide Password Eye Icon Button -->
                    <button type="button" id="togglePassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 transition-colors focus:outline-none cursor-pointer">
                        <!-- Default Eye Icon (Hidden State) -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-slate-900 h-3 rounded-full mt-4 overflow-hidden border border-slate-700">
                    <div id="progressBar" class="h-full w-0 transition-all duration-300 bg-slate-700"></div>
                </div>

                <!-- Strength -->
                <div class="mt-2 text-sm">
                    <span id="strengthText" class="text-slate-400 font-medium">
                        Strength: 0%
                    </span>
                </div>

                <!-- Requirements -->
                <ul class="mt-4 list-none p-0 text-xs">
                    <li id="lengthReq" class="mb-2 text-slate-400">
                        ❌ At least 8 numbers (20%)
                    </li>
                    <li id="lowerReq" class="mb-2 text-slate-400">
                        ❌ At least 6 lowercase letters (40%)
                    </li>
                    <li id="upperReq" class="mb-2 text-slate-400">
                        ❌ At least 6 uppercase letters (40%)
                    </li>
                </ul>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" disabled
                    class="w-full mt-6 py-3 px-4 bg-sky-900 hover:bg-sky-800 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold rounded-xl transition-all cursor-pointer disabled:cursor-not-allowed shadow-md">
                    Submit Password
                </button>
            </div>
        </form>

    </div>

    <script src="script2.js"></script>

</body>

</html>
